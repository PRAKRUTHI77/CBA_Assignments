<!DOCTYPE html>
<html>
<body>

<input type="text" id="name" placeholder="Enter your name">
<button onclick="welcome()">Submit</button>

<p id="msg"></p>

<script>
function welcome() {
  let name = document.getElementById("name").value;
  document.getElementById("msg").innerText = "Welcome, " + name + "!";
}
</script>

</body>
</html>
