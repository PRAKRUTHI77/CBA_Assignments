<!DOCTYPE html>
<html>
<body>

<input type="text" id="word" placeholder="Type a word...">
<button onclick="countLetters()">Count</button>

<p id="result"></p>

<script>
function countLetters() {
  // Get the text from the box
  let text = document.getElementById("word").value;
  // Show the length (number of characters)
  document.getElementById("result").innerText = "Length: " + text.length;
}
</script>

</body>
</html>
