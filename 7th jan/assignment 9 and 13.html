<!DOCTYPE html>
<html>
<body>

<h1 id="headline">Click to change my color!</h1>
<button onclick="makeBlue()">Blue</button>
<button onclick="makeRed()">Red</button>

<script>
function makeBlue() {
  document.getElementById("headline").style.color = "blue";
}

function makeRed() {
  document.getElementById("headline").style.color = "red";
}
</script>

</body>
</html>
